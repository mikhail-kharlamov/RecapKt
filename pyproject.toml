url = "https://github.com/emnigma/RecapKt.git"
[project]
name = "recapkt"
version = "0.1.0"
description = "A dialogue system for text summarization"
authors = [
    { name = "ArtemKushnir" },
    { name = "Mikhail Kharlamov" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorlog~=6.10.1",
    "dataclasses-json~=0.6.7",
    "datasets==4.0.0",
    "faiss-cpu==1.11.0",
    "jinja2==3.1.6",
    "langchain>=0.3.27,<0.4.0",
    "langchain-community~=0.3.31",
    "langchain-core>=0.3.72,<1.0.0",
    "langchain-openai==0.3.28",
    "langgraph==0.5.3",
    "load-dotenv>=0.1.0",
    "matplotlib~=3.10.7",
    "numpy>=1.26.2",
    "openai~=1.109.1",
    "pandas~=2.3.3",
    "pydantic~=2.11.9",
    "pytest>=9.0.2",
    "python-dotenv~=1.1.1",
    "scikit-learn==1.5.2",
    "seaborn~=0.13.2",
    "tiktoken==0.9.0",
]

[project.scripts]
recapkt = "src.main:main"

[project.urls]
Homepage = "https://github.com/emnigma/RecapKt.git"
Repository = "https://github.com/emnigma/RecapKt.git"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "Q", "UP"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.mypy]
files = ["src"]
install_types = "True"
non_interactive = "True"
disallow_untyped_defs = "True"
ignore_missing_imports = "True"
show_error_codes = "True"
warn_redundant_casts = "True"
warn_unused_configs = "True"
warn_unused_ignores = "True"
allow_redefinition = "True"
warn_no_return = "False"
no_implicit_optional = "False"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--color=yes", "-s"]

[dependency-groups]
dev = []
